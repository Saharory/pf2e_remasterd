name: Build Encounter+ release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated files as a GitHub Release
        required: true
        default: false
        type: boolean
      legal_clearance:
        description: Type PUBLICATION CLEARED to permit artifact upload or publication
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development checks
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate, package, and inspect
        run: |
          python3 tools/eplus_dev.py check --json
          python3 tools/package_public_release.py
          python3 tools/eplus_dev.py inspect-release --json
      - name: Check artifact and publication gate
        if: ${{ inputs.publish || inputs.legal_clearance != '' }}
        env:
          LEGAL_CLEARANCE: ${{ inputs.legal_clearance }}
        run: |
          if [ "$LEGAL_CLEARANCE" != "PUBLICATION CLEARED" ]; then
            echo "Artifact upload and publication remain blocked by LEGAL-REVIEW.md"
            exit 1
          fi
      - name: Upload legally cleared build artifact
        if: ${{ inputs.legal_clearance == 'PUBLICATION CLEARED' }}
        uses: actions/upload-artifact@v7
        with:
          name: encounterplus-pf2e-remaster
          path: |
            dist/pf2e-remaster.system
            dist/manifest.json
            dist/release-summary.json
            dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: ${{ inputs.publish && inputs.legal_clearance == 'PUBLICATION CLEARED' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("manifest.json"))["version"])')
          TAG="v${VERSION}"
          gh release create "$TAG" \
            --title "Pathfinder 2E Remaster ${VERSION}" \
            --generate-notes \
            dist/pf2e-remaster.system \
            dist/manifest.json \
            dist/release-summary.json \
            dist/SHA256SUMS.txt
