name: Validate public compendium

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public content boundary and data integrity
        run: |
          python3 tools/validate_public_orc_compendium.py
          python3 tools/validate_public_ogl_compendium.py
